name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release assets
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Verify release comes from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py notes --version "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build archives and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make dist VERSION="$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --draft --title "sshm $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release-state.json"; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/release-state.json")" != true ]]; then
              echo 'This release is already published; create a new version instead.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt --clobber
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
