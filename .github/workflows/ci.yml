name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and terminal smoke (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Tests with race detector
        run: make test
      - name: Static checks
        run: make check
      - name: Build
        run: make build
      - name: Terminal smoke
        run: python3 scripts/terminal_smoke.py ./bin/sshm
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  artifacts:
    name: Build all platforms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - name: Package development builds
        run: make dist VERSION="0.0.0-dev.run${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sshm-development-builds
          path: dist/*
          if-no-files-found: error
          retention-days: 14
